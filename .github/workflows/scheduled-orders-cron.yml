name: Activate Scheduled Orders (manual fallback)

# The database now does this every 5 minutes (pg_cron -> public.run_order_housekeeping),
# so the automatic schedule here is off: it only duplicated the work and, on a private
# repo, would have used far more than the free Actions minutes.
# Kept as a manual fallback — run it from the Actions tab if pg_cron is ever unavailable.

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduled-orders function
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/scheduled-orders" \
            -d '{}'
