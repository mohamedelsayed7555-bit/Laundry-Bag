name: Build Customer App APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Set environment variables
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://kjqtrmedkvqfofwymoni.supabase.co" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqcXRybWVka3ZxZm9md3ltb25pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MjQ5NjIsImV4cCI6MjA5NjMwMDk2Mn0.P9VHNeyCXZhVA1f8P_G1SW_mj3C1iiOYIva0pUFnH6s" >> $GITHUB_ENV

      - name: Prebuild Android
        working-directory: apps/customer-app
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: apps/customer-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-apk
          path: apps/customer-app/android/app/build/outputs/apk/release/*.apk
